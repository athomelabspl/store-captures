# Android counterpart of capture.yml. Same rules: this repo is public, so it holds NO project details (see capture.yml).
# Linux runners are free for public repos and have hardware acceleration for the emulator.
# Secrets: EXPO_TOKEN, EAS_STUB_APP_JSON, FLOWS_B64, SHOT_EMAIL, SHOT_PASSWORD, ART_KEY (all shared with capture.yml).
name: capture-android

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build id (Android APK)'
        required: true
        type: string
      flow:
        description: 'Flow path in the flows bundle'
        required: false
        default: '.maestro/store/run.yaml'
        type: string
      locale:
        description: 'Language'
        required: false
        default: 'en'
        type: string
      appearance:
        description: 'light or dark'
        required: false
        default: 'dark'
        type: choice
        options: [light, dark]
      api_level:
        description: 'Android API level of the emulator'
        required: false
        default: '34'
        type: string

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id }}
      FLOW: ${{ inputs.flow }}
      LOCALE: ${{ inputs.locale }}
      APPEARANCE: ${{ inputs.appearance }}
      SHOT_EMAIL: ${{ secrets.SHOT_EMAIL }}
      SHOT_PASSWORD: ${{ secrets.SHOT_PASSWORD }}
      FLOWS_B64: ${{ secrets.FLOWS_B64 }}
      EAS_STUB_APP_JSON: ${{ secrets.EAS_STUB_APP_JSON }}
      ART_KEY: ${{ secrets.ART_KEY }}
      OUT_DIR: ${{ github.workspace }}/maestro-out
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack the flows
        run: |
          set -euo pipefail
          mkdir -p src "$OUT_DIR"
          printf '%s' "$FLOWS_B64" | base64 -d | tar -xzf - -C src
          test -f "src/$FLOW" || { echo "Flow file not found"; exit 1; }

      - name: Fetch the EAS Android build
        run: |
          set -euo pipefail
          mkdir -p stub build
          printf '%s' "$EAS_STUB_APP_JSON" > stub/app.json
          echo '{"name":"stub","version":"1.0.0"}' > stub/package.json
          (cd stub && npx --yes eas-cli build:view "$BUILD_ID" --json) > view.json 2> "$OUT_DIR/eas-stderr.txt" \
            || { echo "eas build:view failed (details in the encrypted debug artifact)"; exit 1; }
          python3 - <<'PY'
          import json,sys
          raw=open('view.json').read()
          d=json.loads(raw[raw.index('{'):raw.rindex('}')+1])
          if d.get('status')!='FINISHED' or d.get('platform')!='ANDROID':
              sys.exit("Build is not a finished Android build")
          url=(d.get('artifacts') or {}).get('buildUrl')
          if not url: sys.exit('Build has no downloadable artifact')
          open('url.txt','w').write(url)
          PY
          url=$(cat url.txt)
          echo "::add-mask::$url"
          curl -fsSL --retry 3 "$url" -o build/app.apk
          rm -f view.json url.txt
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          pkg=$("$aapt2" dump packagename build/app.apk)
          echo "::add-mask::$pkg"
          echo "APP_ID=$pkg" >> "$GITHUB_ENV"
          echo "APK_PATH=$PWD/build/app.apk" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash >/dev/null 2>&1
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The system language must be set when the emulator boots (the per-app locale command did not change the app's
      # language). Tags: en-US, es-ES, fr-FR, de-DE, pt-BR, pl-PL.
      - name: Pick the system locale
        run: |
          case "$LOCALE" in
            es) tag=es-ES ;; fr) tag=fr-FR ;; de) tag=de-DE ;; pt) tag=pt-BR ;; pl) tag=pl-PL ;; *) tag=en-US ;;
          esac
          echo "LOCALE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action runs each line of `script` as its own shell command, so the work lives in a file.
      - name: Write the emulator script
        run: |
          cat > run-on-emulator.sh <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          adb wait-for-device
          adb install -r "$APK_PATH" >/dev/null
          # Appearance: the app pins its theme to the system setting.
          if [ "$APPEARANCE" = "dark" ]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi
          # Language: set at emulator boot (see the workflow). Log what the device ended up with.
          echo "system locale: $(adb shell getprop persist.sys.locale) / $(adb shell getprop ro.product.locale)" > "$OUT_DIR/locale.txt" 2>&1 || true
          # No notification permission prompt.
          adb shell pm grant "$APP_ID" android.permission.POST_NOTIFICATIONS || true
          # Clean status bar: 9:41, full battery and signal, no notification icons.
          adb shell settings put global sysui_demo_allowed 1
          adb shell am broadcast -a com.android.systemui.demo -e command enter >/dev/null
          adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941 >/dev/null
          adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false >/dev/null
          adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e datatype none -e level 4 >/dev/null
          adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false >/dev/null
          mkdir -p "$OUT_DIR"
          maestro --device emulator-5554 test \
            -e APP_ID="$APP_ID" -e SHOT_EMAIL="$SHOT_EMAIL" -e SHOT_PASSWORD="$SHOT_PASSWORD" \
            --format junit --output "$OUT_DIR/report.xml" \
            --test-output-dir "$OUT_DIR" \
            "src/$FLOW" > "$OUT_DIR/maestro-console.txt" 2>&1
          code=$?
          adb exec-out screencap -p > "$OUT_DIR/final-state.png" || true
          adb logcat -d > "$OUT_DIR/logcat.txt" 2>&1 || true
          exit $code
          SH
          chmod +x run-on-emulator.sh

      - name: Run the flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          # Nexus 5X is 1080 x 1920, the Google Play screenshot canvas.
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -prop persist.sys.locale=${{ env.LOCALE_TAG }}
          script: bash ./run-on-emulator.sh

      - name: Collect raw captures
        if: always() && contains(inputs.flow, '.maestro/store')
        run: |
          set -euo pipefail
          dest="screenshots-raw/$LOCALE/android"
          if [ "$APPEARANCE" = "dark" ]; then dest="$dest/dark"; fi
          mkdir -p "$dest"
          : > missing-captures.txt
          # Google Play gets 8 slots: no mood check-in, no constellation found.
          for slug in quiz-result mood-checkin today support-hub journal sky-sphere mood-chart your-peace constellation-found day-complete; do
            f=$(find "$OUT_DIR" . -maxdepth 8 -name "$slug.png" -not -path './node_modules/*' -not -path './screenshots-raw/*' 2>/dev/null | head -1)
            case "$slug" in
              mood-checkin) name=mood-check-in ;;
              day-complete) name=closing ;;
              *) name="$slug" ;;
            esac
            if [ -n "$f" ]; then
              cp "$f" "$dest/$name.png"
            else
              case "$slug" in
                mood-checkin|constellation-found) ;;
                *) echo "$slug" >> missing-captures.txt ;;
              esac
            fi
          done
          ls "$dest" | wc -l

      - uses: actions/upload-artifact@v5
        if: always() && contains(inputs.flow, '.maestro/store')
        with:
          name: store-screenshots-raw-android-${{ inputs.locale }}-${{ inputs.appearance }}
          path: screenshots-raw
          if-no-files-found: warn

      - name: Encrypt the debug bundle
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          tar -czf - maestro-out | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ART_KEY -out debug.tgz.enc

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: debug-encrypted-android
          path: debug.tgz.enc
          if-no-files-found: warn

      - name: Fail if a capture is missing
        if: always() && contains(inputs.flow, '.maestro/store')
        run: |
          if [ -s missing-captures.txt ]; then
            echo "::error::Missing captures: $(paste -sd" " missing-captures.txt)"
            exit 1
          fi
